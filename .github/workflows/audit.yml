name: audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.12'
      # somme sha256 officielle (actionlint_1.7.12_checksums.txt de la release v1.7.12)
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
      # identifiant de la même archive dans l'API GitHub (repli quand le CDN des releases répond 504) ; somme vérifiée identique
      ACTIONLINT_ASSET_ID: '384924896'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: actionlint (téléchargement vérifié par sha256)
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 15 --retry-all-errors --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            || curl --fail --silent --show-error --location --retry 3 --retry-delay 15 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" --output "$RUNNER_TEMP/$archive" \
              "https://api.github.com/repos/rhysd/actionlint/releases/assets/${ACTIONLINT_ASSET_ID}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml
      - name: zizmor (version et somme épinglées)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r .github/audit/zizmor-requirements.txt
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline .github/workflows
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: audit des dépendances (aucune faille critique ou haute)
        run: pnpm audit --prod=false --audit-level=high
