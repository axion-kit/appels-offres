name: avancement

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: avancement
  cancel-in-progress: false

jobs:
  generer:
    # Le gabarit lui-même ne publie pas de page : seuls les outils créés depuis lui la publient.
    if: github.repository != 'axion-kit/kit-modele'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      pages: read
    outputs:
      actif: ${{ steps.pages.outputs.actif }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Lire la visibilité du dépôt et l'existence de la branche etat
        id: depot
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          # Lu par l'API (l'événement horaire ne porte pas le dépôt) ; toute erreur vaut « non public ».
          vis=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${DEPOT}" | jq -r '.visibility // "inconnue"' || echo inconnue)
          if [ "$vis" = "public" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${DEPOT}/branches/etat" || true)
          if [ "$code" = "200" ]; then echo "etat=true" >> "$GITHUB_OUTPUT"; else echo "etat=false" >> "$GITHUB_OUTPUT"; fi
      - name: Extraire la branche etat (SPEC.md et REPRENDRE.md à jour)
        if: steps.depot.outputs.etat == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: etat
          path: .etat
          persist-credentials: false
      - name: Vérifier que GitHub Pages est activé en mode « GitHub Actions »
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          code=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${DEPOT}/pages" || true)
          if [ "$code" = "404" ]; then
            echo "::warning::Page d'avancement non activée (voir docs/avancement.md)"
            echo "actif=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Impossible de vérifier GitHub Pages (réponse ${code}). Voir docs/avancement.md."
            exit 1
          fi
          if [ "$(jq -r '.build_type' pages.json)" != "workflow" ]; then
            echo "::error::GitHub Pages n'est pas réglé sur « GitHub Actions ». Réglages > Pages > Source : GitHub Actions (voir docs/avancement.md)."
            exit 1
          fi
          echo "actif=true" >> "$GITHUB_OUTPUT"
      - name: Générer la page d'avancement
        if: steps.pages.outputs.actif == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Dépôt non public (ou valeur absente) : objectif, prochaine action et question sont masqués.
          DEPOT_PUBLIC: ${{ steps.depot.outputs.public }}
        run: node outils/avancement/generer.mjs
      - if: steps.pages.outputs.actif == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deployer:
    if: github.repository != 'axion-kit/kit-modele' && needs.generer.outputs.actif == 'true'
    needs: generer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
